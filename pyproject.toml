[project]
name = "producer-copilot"
version = "0.1.0"
description = "Agent-assisted live broadcast graphics desk: synthetic match events in, fact-checked timed overlays out."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core>=1.22.0",
    "agent-framework-openai>=1.17.0",
    "faker>=40.43.0",
    "fastapi>=0.150.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
